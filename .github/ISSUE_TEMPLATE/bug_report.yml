name: Bug report
description: 报告崩溃、显示错误、解析偏差或交互问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传客户图纸、项目地址、个人信息或任何访问令牌。请尽量提供脱敏后的最小样例。
  - type: input
    id: version
    attributes:
      label: 速看CAD版本
      placeholder: 2.0.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS Intel
        - macOS Apple Silicon
        - Windows x64
        - 其他
    validations:
      required: true
  - type: dropdown
    id: file_type
    attributes:
      label: 文件类型
      options:
        - DWG
        - DXF
        - PDF
        - 与文件解析无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志或脱敏样例
      description: 请移除敏感信息。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue。
          required: true
        - label: 我未上传访问令牌或未经授权的敏感图纸。
          required: true
